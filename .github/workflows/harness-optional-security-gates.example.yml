name: Harness Optional Security Gates (Example)

on:
  pull_request:
  workflow_dispatch:

jobs:
  optional-security-gates:
    runs-on: ubuntu-latest
    env:
      HARNESS_ENABLE_OPTIONAL_SECURITY_GATES: "false"
      HARNESS_ENABLE_OPTIONAL_OKF_STRICT_TARGETED: "false"
      HARNESS_ENABLE_OPTIONAL_MEMORY_BRIEF_POLICY: "false"
      HARNESS_LURKR_COMMAND: "npx lurkr scan ."
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Compute changed-surface base
        if: env.HARNESS_ENABLE_OPTIONAL_SECURITY_GATES == 'true'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "HARNESS_CHANGED_SURFACE_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "HARNESS_CHANGED_SURFACE_BASE=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV"
          fi

      - name: Changed-surface warning checks (optional)
        if: env.HARNESS_ENABLE_OPTIONAL_SECURITY_GATES == 'true'
        run: |
          npm run harness:docs:check:changed-surfaces -- --changed-surface-base "$HARNESS_CHANGED_SURFACE_BASE"

      - name: Lurkr required mode (optional)
        if: env.HARNESS_ENABLE_OPTIONAL_SECURITY_GATES == 'true'
        run: |
          node scripts/harness/lurkr-check.mjs --required

      - name: Strict OKF on changed memory files (optional)
        if: env.HARNESS_ENABLE_OPTIONAL_OKF_STRICT_TARGETED == 'true'
        shell: bash
        run: |
          BASE_SHA="${HARNESS_CHANGED_SURFACE_BASE:-$(git rev-parse HEAD~1)}"
          mapfile -t changed_memory < <(git diff --name-only "$BASE_SHA...HEAD" -- \
            '.github/harness/memory/lessons/*.md' \
            '.github/harness/memory/briefs/*.md' \
            | grep -v -E 'README\.md$|_template\.md$' || true)

          if [[ ${#changed_memory[@]} -eq 0 ]]; then
            echo "No changed memory markdown files detected; strict targeted OKF gate skipped."
            exit 0
          fi

          args=()
          for path in "${changed_memory[@]}"; do
            args+=(--target "$path")
          done

          npm run harness:okf:phase0 -- --json --strict-okf "${args[@]}"

      - name: Changed briefs strict status + strict OKF policy (optional)
        if: env.HARNESS_ENABLE_OPTIONAL_MEMORY_BRIEF_POLICY == 'true'
        shell: bash
        run: |
          BASE_SHA="${HARNESS_CHANGED_SURFACE_BASE:-$(git rev-parse HEAD~1)}"
          mapfile -t changed_briefs < <(git diff --name-only "$BASE_SHA...HEAD" -- \
            '.github/harness/memory/briefs/*.md' \
            | grep -v -E 'README\.md$' || true)

          if [[ ${#changed_briefs[@]} -eq 0 ]]; then
            echo "No changed memory briefs detected; optional brief policy skipped."
            exit 0
          fi

          memory_json="$(node scripts/harness/memory-curate.mjs --json)"
          node -e "
            const report = JSON.parse(process.argv[1]);
            const changed = new Set(process.argv.slice(2));
            const offenders = (report.entries || []).filter(entry => {
              const rel = '.github/harness/memory/briefs/' + entry.slug;
              if (entry.kind !== 'brief' || !changed.has(rel)) return false;
              return (entry.flags || []).includes('malformed-status') || (entry.flags || []).includes('superseded-no-pointer');
            });
            if (offenders.length) {
              console.error('Changed brief strict-status violations detected:');
              for (const o of offenders) {
                console.error('- ' + o.slug + ' :: ' + (o.flags || []).join(','));
              }
              process.exit(1);
            }
          " "$memory_json" "${changed_briefs[@]}"

          args=()
          for path in "${changed_briefs[@]}"; do
            args+=(--target "$path")
          done

          okf_json="$(node scripts/harness/okf-phase0.mjs --json --strict-okf "${args[@]}" || true)"
          node -e "
            const report = JSON.parse(process.argv[1]);
            const conf = report?.checks?.okfConformance || {};
            const missingFrontmatter = Number(conf.missingFrontmatter || 0);
            const missingType = Number(conf.missingType || 0);
            if (missingFrontmatter > 0 || missingType > 0) {
              console.error('Changed brief strict OKF conformance violations detected:');
              console.error('- missingFrontmatter=' + missingFrontmatter + ', missingType=' + missingType);
              process.exit(1);
            }
          " "$okf_json"

      - name: Optional gates skipped
        if: env.HARNESS_ENABLE_OPTIONAL_SECURITY_GATES != 'true' && env.HARNESS_ENABLE_OPTIONAL_OKF_STRICT_TARGETED != 'true' && env.HARNESS_ENABLE_OPTIONAL_MEMORY_BRIEF_POLICY != 'true'
        run: echo "Optional gates are disabled (set HARNESS_ENABLE_OPTIONAL_SECURITY_GATES='true', HARNESS_ENABLE_OPTIONAL_OKF_STRICT_TARGETED='true', and/or HARNESS_ENABLE_OPTIONAL_MEMORY_BRIEF_POLICY='true' to enable)."
